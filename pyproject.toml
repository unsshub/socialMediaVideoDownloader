[project]
name = "smvd"
version = "0.1.0"
description = "Local web app to download videos from TikTok, Instagram, and Facebook"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "yt-dlp>=2024.4.9",
]

[project.scripts]
smvd = "smvd.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smvd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
